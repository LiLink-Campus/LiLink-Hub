<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>小红书创作者平台（fixture 复刻）</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .hidden { display: none; }
    .ql-editor, p[contenteditable] { border: 1px solid #ccc; min-height: 80px; padding: 8px; }
    #creator-editor-topic-container { border: 1px solid #f33; padding: 4px; }
    button { margin-top: 16px; padding: 8px 20px; }
  </style>
</head>
<body>
  <div id="login" class="hidden">扫码登录</div>

  <h2>上传图文</h2>

  <!-- 图片 file input（real: input[type="file"][accept*="image"]） -->
  <input id="file" type="file" accept="image/*" multiple />
  <div id="filename"></div>

  <!-- 上传完成信号（real: text=上传成功） -->
  <div id="done" class="hidden">上传成功</div>

  <h3>标题</h3>
  <input id="title" type="text" placeholder="填写标题会有更多赞哦" />

  <h3>正文</h3>
  <!-- real: p[data-placeholder*="输入正文描述"] -->
  <p id="body" data-placeholder="输入正文描述" contenteditable="true"></p>

  <!-- 话题联想下拉（real: #creator-editor-topic-container .item） -->
  <div id="creator-editor-topic-container" class="hidden">
    <div class="item">话题联想项</div>
  </div>

  <button id="publish">发布</button>
  <div id="status"></div>

  <script>
    const qs = new URLSearchParams(location.search)
    if (qs.has('notLoggedIn')) document.getElementById('login').classList.remove('hidden')

    document.getElementById('file').addEventListener('change', (e) => {
      const names = Array.from(e.target.files || []).map((f) => f.name).join(',')
      document.getElementById('filename').textContent = names
      document.getElementById('done').classList.remove('hidden')
    })

    // 话题：正文里输入 '#' 即弹联想下拉
    const body = document.getElementById('body')
    const topic = document.getElementById('creator-editor-topic-container')
    body.addEventListener('input', () => {
      if (body.textContent.includes('#')) topic.classList.remove('hidden')
    })
    topic.querySelector('.item').addEventListener('click', () => {
      // 选中联想项：把当前 # 词标记为结构化话题（这里简单收起下拉）
      topic.classList.add('hidden')
      body.dataset.tagPicked = (Number(body.dataset.tagPicked || '0') + 1).toString()
    })

    document.getElementById('publish').addEventListener('click', () => {
      document.getElementById('status').textContent = 'published'
      history.pushState({}, '', '/published/success')
    })
  </script>
</body>
</html>
